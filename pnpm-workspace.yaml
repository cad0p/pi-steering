packages:
  - 'examples/*'
# Own packages: fresh publishes (<24h old) trip pnpm 11's minimumReleaseAge
# guard; bare names exclude all versions (the @version form only matched
# the first named version — see pi-napkin's workspace file for the same
# comment).
minimumReleaseAgeExclude:
  - '@cad0p/unbash-walker'
  - '@cad0p/pi-steering'
